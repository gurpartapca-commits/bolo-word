<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=Edge" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bolo Punjabi</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Gurmukhi&family=Mukta+Mahee:wght@400;500;700&family=Noto+Sans+Gurmukhi:wght@400;600&display=swap" />
<style>
:root {
  --cloth: #f4f5fa; --sheet: #ffffff; --ink: #1d2045; --muted: #5d6185; --line: #dfe1ee;
  --thread: #c0245e; --thread-ink: #ffffff; --marigold: #e9a100; --ok: #1b8a5a;
  --warn-bg: #fff4dc; --warn-ink: #6b4a00;
  --font-display: "Tiro Gurmukhi", "Noto Serif Gurmukhi", Georgia, serif;
  --font-ui: "Mukta Mahee", "Noto Sans Gurmukhi", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --cloth: #12142b; --sheet: #1a1d3a; --ink: #eceefb; --muted: #a3a7cc; --line: #2e3258;
    --thread: #ff5c95; --thread-ink: #1a0510; --marigold: #ffc23d; --ok: #4fd39a;
    --warn-bg: #3a2e10; --warn-ink: #ffe2a3; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --cloth: #12142b; --sheet: #1a1d3a; --ink: #eceefb; --muted: #a3a7cc; --line: #2e3258;
  --thread: #ff5c95; --thread-ink: #1a0510; --marigold: #ffc23d; --ok: #4fd39a;
  --warn-bg: #3a2e10; --warn-ink: #ffe2a3; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--cloth); color: var(--ink); font: 14px/1.5 var(--font-ui); padding: 14px; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--thread); outline-offset: 2px; }

.brand { display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; }
.brand .g { font-family: var(--font-display); font-size: 26px; line-height: 1; color: var(--thread); }
.brand .l { font-weight: 700; font-size: 15px; }

.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 16px 14px; }
.stage { display: grid; justify-items: center; gap: 10px; text-align: center; }
.mic {
  width: 84px; height: 84px; border-radius: 50%; border: 0; cursor: pointer; position: relative;
  background: var(--thread); color: var(--thread-ink); display: grid; place-items: center;
  box-shadow: 0 6px 18px color-mix(in srgb, var(--thread) 35%, transparent);
  transition: transform .15s ease, background .2s ease;
}
.mic:hover { transform: scale(1.04); }
.mic:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.mic svg { width: 34px; height: 34px; }
.mic[aria-pressed="true"] { background: var(--marigold); color: #241800; }
.mic[aria-pressed="true"]::before, .mic[aria-pressed="true"]::after {
  content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--marigold); opacity: .6;
  animation: ring 1.6s ease-out infinite;
}
.mic[aria-pressed="true"]::after { animation-delay: .8s; }
@keyframes ring { from { transform: scale(.9); opacity: .7; } to { transform: scale(1.35); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .mic[aria-pressed="true"]::before, .mic[aria-pressed="true"]::after { animation: none; } }
.status { font-weight: 700; font-size: 16px; display: flex; gap: 8px; align-items: center; justify-content: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.listening .dot { background: var(--marigold); }
.timer { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500; }
.hint { color: var(--muted); font-size: 13px; }

.hearing {
  margin-top: 12px; min-height: 3.2em; padding: 8px 10px; border-radius: 10px; background: var(--cloth);
  color: var(--muted); font-style: italic; font-size: 17px; overflow-wrap: anywhere; font-family: "Noto Sans Gurmukhi", var(--font-ui);
}
.hearing:empty::before { content: attr(data-empty); font-style: normal; font-size: 13px; opacity: .8; }

.settings { display: grid; gap: 12px; margin-top: 14px; }
.field { display: grid; gap: 3px; }
.field label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.field select { border: 1px solid var(--line); background: var(--sheet); border-radius: 9px; padding: 7px 9px; width: 100%; }
.toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.toggle input { accent-color: var(--thread); width: 16px; height: 16px; }

.banner { padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-ink); font-size: 13px; margin-bottom: 12px; }
.banner button { margin-top: 8px; border: 0; border-radius: 8px; padding: 6px 10px; background: var(--ink); color: var(--sheet); cursor: pointer; font-weight: 600; }

details { margin-top: 16px; }
summary { cursor: pointer; font-weight: 700; }
table.cmds { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 13px; }
table.cmds td { padding: 4px 0; border-bottom: 1px solid var(--line); }
table.cmds td:last-child { text-align: right; font-weight: 700; padding-left: 8px; }
.foot { color: var(--muted); font-size: 12px; margin-top: 14px; }
kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; background: var(--sheet); }
</style>
</head>
<body>
  <div class="brand"><span class="g" lang="pa">ਬੋਲੋ</span><span class="l">Bolo Punjabi</span></div>

  <div class="banner" id="banner" role="alert" hidden><span id="bannerText"></span><br /><button type="button" id="webBtn" hidden>Open Bolo in your browser</button></div>

  <div class="card">
    <div class="stage" id="state">
      <button class="mic" id="mic" type="button" aria-pressed="false" aria-label="Start speaking" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3.5"/></svg>
      </button>
      <div class="status" aria-live="polite"><span class="dot"></span><span id="status">Loading…</span><span class="timer" id="timer">00:00</span></div>
      <div class="hint" id="hint">Click in your document where the text should go, then press the mic.</div>
    </div>
    <div class="hearing" id="hearing" data-empty="Words you're saying show here first, then go into your document." aria-live="off"></div>
  </div>

  <div class="settings">
    <div class="field">
      <label for="lang">Language</label>
      <select id="lang">
        <option value="pa">ਪੰਜਾਬੀ · Punjabi (Gurmukhi)</option>
        <option value="hi">हिन्दी · Hindi</option>
        <option value="ur">اردو · Urdu</option>
        <option value="en-IN">English (India)</option>
        <option value="en-US">English (US)</option>
      </select>
    </div>
    <div class="field">
      <label for="font">Font for new text</label>
      <select id="font"></select>
    </div>
    <label class="toggle" id="numeralsWrap"><input type="checkbox" id="numerals" /> Gurmukhi numerals <span lang="pa">੧੨੩</span></label>
    <label class="toggle"><input type="checkbox" id="spoken" checked /> Spoken punctuation</label>
  </div>

  <details>
    <summary>Say the punctuation</summary>
    <table class="cmds" id="cmdTable" aria-label="Spoken punctuation commands"></table>
  </details>

  <p class="foot">Text goes in at your cursor. Check names, numbers and English words afterwards. Shortcut while this panel has focus: <kbd>Ctrl</kbd>+<kbd>M</kbd>.</p>

<script>
(() => {
  const LANGS = {
    pa: {
      codes: ['pa-Guru-IN', 'pa-IN'], dir: 'ltr', status: 'Listening in Punjabi…',
      fonts: ['Raavi', 'Nirmala UI', 'Noto Sans Gurmukhi', 'Noto Serif Gurmukhi', 'Mukta Mahee', 'Anek Gurmukhi', 'Baloo Paaji 2', 'AnmolUni'],
      cmds: [
        [['ਡੰਡੀ', 'ਪੂਰਨ ਵਿਰਾਮ', 'ਫੁੱਲ ਸਟਾਪ'], '।'],
        [['ਕੌਮਾ', 'ਕਾਮਾ', 'ਵਿਸ਼ਰਾਮ ਚਿੰਨ੍ਹ'], ','],
        [['ਪ੍ਰਸ਼ਨ ਚਿੰਨ੍ਹ', 'ਸਵਾਲੀਆ ਨਿਸ਼ਾਨ', 'ਪ੍ਰਸ਼ਨਵਾਚਕ ਚਿੰਨ੍ਹ'], '?'],
        [['ਵਿਸਮਿਕ ਚਿੰਨ੍ਹ', 'ਵਿਸਮਿਕ'], '!'],
        [['ਨਵਾਂ ਪੈਰਾ', 'ਨਵਾਂ ਪੈਰਾਗ੍ਰਾਫ'], '\n\n'],
        [['ਨਵੀਂ ਲਾਈਨ', 'ਨਵੀਂ ਸਤਰ', 'ਅਗਲੀ ਲਾਈਨ'], '\n']
      ]
    },
    hi: {
      codes: ['hi-IN'], dir: 'ltr', status: 'Listening in Hindi…',
      fonts: ['Nirmala UI', 'Mangal', 'Noto Sans Devanagari', 'Hind', 'Tiro Devanagari Hindi'],
      cmds: [
        [['पूर्ण विराम', 'फुल स्टॉप'], '।'], [['अल्पविराम', 'कॉमा'], ','],
        [['प्रश्नवाचक चिह्न', 'प्रश्न चिह्न', 'प्रश्न चिन्ह'], '?'], [['विस्मयादिबोधक चिह्न'], '!'],
        [['नया पैराग्राफ', 'नया अनुच्छेद'], '\n\n'], [['नई लाइन', 'अगली लाइन'], '\n']
      ]
    },
    ur: {
      codes: ['ur-PK', 'ur-IN'], dir: 'rtl', status: 'Listening in Urdu…',
      fonts: ['Jameel Noori Nastaleeq', 'Urdu Typesetting', 'Noto Nastaliq Urdu', 'Gulzar', 'Noto Naskh Arabic', 'Arial'],
      cmds: [
        [['فل اسٹاپ', 'ختمہ'], '۔'], [['کاما', 'سکتہ'], '،'], [['سوالیہ نشان'], '؟'],
        [['نیا پیراگراف'], '\n\n'], [['نئی لائن', 'اگلی لائن'], '\n']
      ]
    },
    'en-IN': {
      codes: ['en-IN'], dir: 'ltr', status: 'Listening in English…',
      fonts: ['(keep document font)', 'Calibri', 'Aptos', 'Times New Roman', 'Arial', 'Georgia'],
      cmds: [
        [['full stop', 'period'], '.'], [['comma'], ','], [['question mark'], '?'], [['exclamation mark'], '!'],
        [['new paragraph'], '\n\n'], [['new line', 'next line'], '\n']
      ]
    }
  };
  LANGS['en-US'] = { ...LANGS['en-IN'], codes: ['en-US'] };
  const KEEP = '(keep document font)';

  const $ = (id) => document.getElementById(id);
  const mic = $('mic'), hearing = $('hearing'), langSel = $('lang'), fontSel = $('font');
  const numerals = $('numerals'), spoken = $('spoken');

  const store = {
    get(k, d) { try { const v = localStorage.getItem('bolo.word.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('bolo.word.' + k, JSON.stringify(v)); } catch {} }
  };

  let lang = store.get('lang', 'pa');
  if (!LANGS[lang]) lang = 'pa';
  langSel.value = lang;
  numerals.checked = store.get('numerals', false);
  spoken.checked = store.get('spoken', true);
  const L = () => LANGS[lang];

  function fillFonts() {
    const fonts = [...new Set([KEEP, ...L().fonts])];
    const saved = store.get('font.' + lang, L().fonts[0]);
    fontSel.innerHTML = '';
    for (const f of fonts) {
      const o = document.createElement('option'); o.value = f; o.textContent = f; fontSel.appendChild(o);
    }
    fontSel.value = fonts.includes(saved) ? saved : L().fonts[0];
  }
  function applyLook() {
    hearing.dir = L().dir;
    hearing.lang = { pa: 'pa', hi: 'hi', ur: 'ur' }[lang] || 'en';
    $('numeralsWrap').hidden = lang !== 'pa';
    const t = $('cmdTable'); t.innerHTML = '';
    for (const [words, mark] of L().cmds) {
      const tr = document.createElement('tr');
      const a = document.createElement('td'); a.textContent = words[0]; a.lang = hearing.lang; a.dir = L().dir;
      const b = document.createElement('td'); b.textContent = mark === '\n' ? '↵ new line' : mark === '\n\n' ? '¶ new paragraph' : mark;
      tr.append(a, b); t.appendChild(tr);
    }
  }

  // ---------- text clean-up (same rules as the web page) ----------
  const GUR_DIGITS = '੦੧੨੩੪੫੬੭੮੯';
  const PUNCT = /^[\n।,?!.۔،؟]/;
  const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  function processChunk(text) {
    let s = text.trim();
    if (!s) return '';
    if (spoken.checked) {
      for (const [words, mark] of L().cmds)
        for (const w of words)
          s = s.replace(new RegExp('\\s*' + esc(w) + '(?=\\s|$)', lang.startsWith('en') ? 'gi' : 'g'), mark);
      s = s.replace(/[ \t]+([।,?!.۔،؟])/g, '$1').replace(/[ \t]*\n[ \t]*/g, '\n');
    }
    if (lang === 'pa' && numerals.checked) s = s.replace(/[0-9]/g, (d) => GUR_DIGITS[+d]);
    return s;
  }

  // ---------- writing into Word ----------
  let chain = Promise.resolve();
  function insertIntoWord(chunk) {
    if (!chunk) return;
    const font = fontSel.value, rtl = L().dir === 'rtl', english = lang.startsWith('en');
    chain = chain.then(() => Word.run(async (ctx) => {
      const sel = ctx.document.getSelection();
      // Look at the text just before the cursor so spacing and capitals come out right.
      let before = null;
      try {
        const para = sel.paragraphs.getFirst();
        const pre = para.getRange('Start').expandTo(sel.getRange('Start'));
        pre.load('text');
        await ctx.sync();
        before = pre.text;
      } catch { before = null; }

      let piece = chunk;
      const atLineStart = before !== null && before.trim() === '';
      if (!atLineStart && !PUNCT.test(piece) && !(before && /\s$/.test(before))) piece = ' ' + piece;
      if (english && (atLineStart || (before && /[.?!]\s*$/.test(before))))
        piece = piece.replace(/^(\s*)(\p{Ll})/u, (m, sp, c) => sp + c.toUpperCase());
      // Word treats a line break as a new paragraph; a blank one gives the paragraph gap.
      piece = piece.replace(/\n\n/g, '\n');

      const r = sel.insertText(piece, 'Replace');
      if (font !== KEEP) r.font.name = font;
      if (rtl) { try { r.paragraphs.load('items'); await ctx.sync(); r.paragraphs.items.forEach((p) => { p.alignment = 'Right'; }); } catch {} }
      r.select('End');
      await ctx.sync();
    })).catch((err) => {
      showBanner('Couldn’t write into the document: ' + (err && err.message ? err.message : err) + '. Click inside the document and try again.');
    });
  }

  // ---------- speech recognition ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, wanted = false, codeIdx = 0, tick = null, started = 0;
  const WEB_URL = new URL('index.html', location.href).href;

  function showBanner(msg, offerWeb) {
    $('bannerText').textContent = msg;
    $('webBtn').hidden = !offerWeb;
    $('banner').hidden = !msg;
  }
  function setStatus(s, hint) { $('status').textContent = s; if (hint !== undefined) $('hint').textContent = hint; }
  const fmt = (ms) => { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

  const NOT_HERE = 'Speech recognition isn’t available inside this version of Word. It works in Word for the web (open your document at office.com in Chrome or Edge). You can also speak in the Bolo web page and paste the text in.';

  function makeRec() {
    const r = new SR();
    r.lang = L().codes[codeIdx] || L().codes[0];
    r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
    r.onstart = () => {
      $('state').classList.add('listening');
      mic.setAttribute('aria-pressed', 'true'); mic.setAttribute('aria-label', 'Stop');
      setStatus(L().status, 'Speak now. Press the mic again to stop.');
      showBanner('');
    };
    r.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i];
        if (res.isFinal) insertIntoWord(processChunk(res[0].transcript));
        else interim += res[0].transcript;
      }
      hearing.textContent = interim;
    };
    r.onerror = (e) => {
      if (e.error === 'no-speech' || e.error === 'aborted') return;
      if (e.error === 'language-not-supported' && codeIdx < L().codes.length - 1) { codeIdx++; return; }
      wanted = false;
      const msgs = {
        'not-allowed': 'Word didn’t let this panel use the microphone. In Word for the web, allow the microphone when the browser asks (or via the lock icon in the address bar), then press the mic again. ' ,
        'service-not-allowed': NOT_HERE,
        network: 'The speech service couldn’t be reached. Check your internet connection. If you’re in desktop Word, this can also mean speech recognition isn’t supported here: try Word for the web.',
        'audio-capture': 'No microphone was found. Plug one in or check your sound settings, then try again.',
        'language-not-supported': 'This language isn’t supported for speech recognition here. Try Word for the web in the latest Chrome.'
      };
      showBanner(msgs[e.error] || 'Speech recognition stopped (' + e.error + '). Press the mic to try again.', e.error !== 'audio-capture');
    };
    r.onend = () => {
      hearing.textContent = '';
      if (wanted) { try { rec = makeRec(); rec.start(); return; } catch {} }
      stopUi();
    };
    return r;
  }
  function stopUi() {
    wanted = false;
    $('state').classList.remove('listening');
    mic.setAttribute('aria-pressed', 'false'); mic.setAttribute('aria-label', 'Start speaking');
    clearInterval(tick);
    setStatus('Ready to listen', 'Click in your document where the text should go, then press the mic.');
  }
  async function start() {
    if (!SR || wanted) return;
    wanted = true; codeIdx = 0;
    // Word for the web can ask the user to allow the microphone for add-ins.
    try {
      const dp = Office.context.devicePermission;
      if (dp && dp.requestPermissionsAsync) await dp.requestPermissionsAsync([Office.DevicePermissionType.microphone]);
    } catch {}
    try {
      rec = makeRec(); rec.start();
      started = Date.now(); clearInterval(tick);
      tick = setInterval(() => ($('timer').textContent = fmt(Date.now() - started)), 250);
    } catch { wanted = false; showBanner('Couldn’t start the microphone. Close and reopen the panel, then try again.', true); }
  }
  function stop() { wanted = false; try { rec && rec.stop(); } catch {} stopUi(); }

  mic.addEventListener('click', () => (wanted ? stop() : start()));
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'm') { e.preventDefault(); wanted ? stop() : start(); }
  });
  $('webBtn').addEventListener('click', () => {
    try { Office.context.ui.openBrowserWindow(WEB_URL); } catch { window.open(WEB_URL, '_blank'); }
  });

  langSel.addEventListener('change', () => {
    const was = wanted; if (was) stop();
    lang = langSel.value; store.set('lang', lang);
    fillFonts(); applyLook();
    if (was) setTimeout(start, 300);
  });
  fontSel.addEventListener('change', () => store.set('font.' + lang, fontSel.value));
  numerals.addEventListener('change', () => store.set('numerals', numerals.checked));
  spoken.addEventListener('change', () => store.set('spoken', spoken.checked));

  fillFonts(); applyLook();

  Office.onReady((info) => {
    if (info.host !== Office.HostType.Word) {
      setStatus('Open this in Microsoft Word', 'This panel only works inside Word.');
      return;
    }
    if (!SR) {
      setStatus('Speech not available here', 'Your Word app can’t do speech recognition in add-ins.');
      showBanner(NOT_HERE, true);
      return;
    }
    mic.disabled = false;
    setStatus('Ready to listen');
  });
})();
</script>
</body>
</html>
